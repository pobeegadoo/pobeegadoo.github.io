<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POB | Visitor Analytics</title>

    <style>
        :root {
            --cyan: #00e5ff;
            --green: #00ff88;
            --bg: #05080d;
            --card: #0a1018;
            --text: #ffffff;
            --muted: #8d96a8;
            --border: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 229, 255, 0.08),
                    transparent 40%
                ),
                var(--bg);

            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 40px 20px;
        }

        .container {
            width: min(900px, 100%);
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            color: var(--cyan);
            font-weight: 800;
            letter-spacing: 4px;
            font-size: 0.9rem;
        }

        h1 {
            margin: 10px 0;
            font-size: 2rem;
        }

        .subtitle {
            color: var(--muted);
        }

        /* =========================================
           LOGIN
        ========================================= */

        .login-card,
        .dashboard {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.05);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #050a10;
            color: white;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: var(--cyan);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--cyan);
            color: #031016;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .error {
            display: none;
            margin-top: 15px;
            color: #ff7777;
            font-size: 0.85rem;
        }

        /* =========================================
           DASHBOARD
        ========================================= */

        .dashboard {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            margin: 0;
        }

        .logout {
            width: auto;
            padding: 9px 15px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--cyan);
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            padding: 25px;
            border-radius: 12px;
            background: #070d14;
            border: 1px solid var(--border);
        }

        .stat-title {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .stat-value {
            color: var(--cyan);
            font-size: 2rem;
            font-weight: 800;
        }

        .section {
            margin-top: 25px;
        }

        .section h3 {
            color: var(--cyan);
            margin-bottom: 15px;
        }

        .country {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .country-count {
            color: var(--green);
            font-weight: 700;
        }

        .visitor {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .visitor-location {
            font-weight: 700;
        }

        .visitor-details {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .loading {
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .logout {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            POB // CYBERSECURITY
        </div>

        <h1>
            Visitor Analytics
        </h1>

        <p class="subtitle">
            Private analytics dashboard
        </p>

    </header>


    <!-- =========================================
         TOKEN ENTRY
    ========================================== -->

    <div
        id="login-card"
        class="login-card"
    >

        <label for="admin-token">
            Admin Token
        </label>

        <input
            type="password"
            id="admin-token"
            placeholder="Enter your admin token"
            autocomplete="off"
        >

        <button
            onclick="loadAnalytics()"
        >
            VIEW ANALYTICS
        </button>

        <div
            id="error"
            class="error"
        >
            Invalid token or unable to retrieve analytics.
        </div>

    </div>


    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <div
        id="dashboard"
        class="dashboard"
    >

        <div class="dashboard-header">

            <h2>
                📊 POB Analytics
            </h2>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    UNIQUE VISITORS
                </div>

                <div
                    id="total-visitors"
                    class="stat-value"
                >
                    —
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    COUNTRIES
                </div>

                <div
                    id="total-countries"
                    class="stat-value"
                >
                    —
                </div>

            </div>

        </div>


        <!-- COUNTRIES -->

        <div class="section">

            <h3>
                🌍 Visitors by Country
            </h3>

            <div id="countries">
                <div class="loading">
                    Loading...
                </div>
            </div>

        </div>


        <!-- RECENT VISITORS -->

        <div class="section">

            <h3>
                📍 Visitor Locations
            </h3>

            <div id="visitors">
                <div class="loading">
                    Loading...
                </div>
            </div>

        </div>

    </div>

</div>


<script>

const WORKER_URL =
    "https://pob-visitor-counter.obeegadooparlan.workers.dev";


/* =========================================
   LOAD ANALYTICS
========================================= */

async function loadAnalytics() {

    const token =
        document.getElementById(
            "admin-token"
        ).value.trim();


    if (!token) {

        showError(
            "Please enter your admin token."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${WORKER_URL}/admin`,
                {
                    method: "GET",

                    headers: {
                        "X-Admin-Token":
                            token
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unauthorized"
            );

        }


        const data =
            await response.json();


        displayAnalytics(data);


        // Keep token only in memory.
        window.adminToken = token;


    } catch (error) {

        console.error(error);

        showError(
            "Invalid token or unable to retrieve analytics."
        );

    }

}


/* =========================================
   DISPLAY ANALYTICS
========================================= */

function displayAnalytics(data) {

    document.getElementById(
        "login-card"
    ).style.display = "none";


    document.getElementById(
        "dashboard"
    ).style.display = "block";


    document.getElementById(
        "total-visitors"
    ).textContent =
        Number(data.total || 0)
        .toLocaleString();


    const countries =
        data.countries || {};


    document.getElementById(
        "total-countries"
    ).textContent =
        Object.keys(countries).length;


    displayCountries(
        countries
    );


    displayVisitors(
        data.visitors || []
    );

}


/* =========================================
   DISPLAY COUNTRIES
========================================= */

function displayCountries(
    countries
) {

    const container =
        document.getElementById(
            "countries"
        );


    container.innerHTML = "";


    const entries =
        Object.entries(countries)
        .sort(
            (a, b) =>
                b[1] - a[1]
        );


    if (!entries.length) {

        container.innerHTML =
            `<div class="loading">
                No location data yet.
             </div>`;

        return;

    }


    entries.forEach(
        ([country, count]) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "country";


            row.innerHTML = `

                <span>
                    ${escapeHTML(country)}
                </span>

                <span class="country-count">
                    ${count}
                </span>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================
   DISPLAY VISITORS
========================================= */

function displayVisitors(
    visitors
) {

    const container =
        document.getElementById(
            "visitors"
        );


    container.innerHTML = "";


    if (!visitors.length) {

        container.innerHTML =
            `<div class="loading">
                No visitor location data yet.
             </div>`;

        return;

    }


    visitors
        .slice()
        .reverse()
        .forEach(
            visitor => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "visitor";


                const city =
                    visitor.city ||
                    "Unknown city";


                const country =
                    visitor.country ||
                    "Unknown country";


                const region =
                    visitor.region ||
                    "Unknown region";


                const timezone =
                    visitor.timezone ||
                    "Unknown timezone";


                const date =
                    visitor.visitedAt
                        ? new Date(
                            visitor.visitedAt
                          ).toLocaleString()
                        : "Unknown date";


                item.innerHTML = `

                    <div class="visitor-location">

                        📍
                        ${escapeHTML(city)},
                        ${escapeHTML(country)}

                    </div>

                    <div class="visitor-details">

                        Region:
                        ${escapeHTML(region)}
                        <br>

                        Timezone:
                        ${escapeHTML(timezone)}
                        <br>

                        Visited:
                        ${escapeHTML(date)}

                    </div>

                `;


                container.appendChild(
                    item
                );

            }
        );

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    window.adminToken = null;


    document.getElementById(
        "dashboard"
    ).style.display = "none";


    document.getElementById(
        "login-card"
    ).style.display = "block";


    document.getElementById(
        "admin-token"
    ).value = "";


    document.getElementById(
        "error"
    ).style.display = "none";

}


/* =========================================
   ERROR
========================================= */

function showError(
    message
) {

    const error =
        document.getElementById(
            "error"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


/* =========================================
   BASIC HTML ESCAPING
========================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("admin-token")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                loadAnalytics();

            }

        }
    );

</script>

</body>
</html>
